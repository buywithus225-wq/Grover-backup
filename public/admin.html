<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grover Admin</title>
<style>
body { background: #030a1a; color: #fff; font-family: sans-serif; padding: 20px; }
.container { max-width: 500px; margin: auto; background: #0a1428; border: 2px solid #8b5cf6; border-radius: 12px; padding: 20px; }
input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #555; background: #111; color: white; }
button { background: #8b5cf6; cursor: pointer; font-weight: bold; border: none; margin-bottom: 10px; }
#login { text-align: center; }
#dashboard { display: none; }
.section-title { font-size: 14px; color: #f5b800; margin-top: 20px; margin-bottom: 10px; font-weight: bold; }
.list-item { background: #111; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.btn-approve { background: #22c55e; padding: 5px 10px; width: auto; font-size: 10px; margin: 0 2px; }
.btn-reject { background: #ef4444; padding: 5px 10px; width: auto; font-size: 10px; margin: 0 2px; }
<script>
const API = 'https://grover-backup.onrender.com'; 
let adminPin = '';
let adminData = { tasks: [] };

async function verifyPin() {
  adminPin = document.getElementById('pin').value;
  try {
    const res = await fetch(API + '/api/admin/verify', {
      method: 'POST', 
      headers: {'Content-Type': 'application/json'}, 
      body: JSON.stringify({ pin: adminPin })
    });
    
    if (res.ok) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      const errorText = await res.text();
      alert('❌ Server rejected PIN. Make sure ADMIN_PIN is set in Render. Server says: ' + errorText);
    }
  } catch (err) {
    alert('❌ Network Error: Render might be asleep or crashed. ' + err.message);
  }
}

async function loadData() {
  try {
    // Load Withdrawals
    const wRes = await fetch(API + '/api/admin/withdrawals?pin=' + adminPin);
    if (!wRes.ok) throw new Error("Failed to load withdrawals");
    const withdrawals = await wRes.json();
    const wList = document.getElementById('withdrawalList'); wList.innerHTML = '';
    
    if(withdrawals.length === 0) wList.innerHTML = '<div style="font-size:11px;color:#555;">No pending withdrawals.</div>';
    
    withdrawals.forEach(w => {
      wList.innerHTML += `
        <div class="list-item">
          <div>User: ${w.userId.slice(-6)}<br>Amt: ${w.amount} GROV<br>Wallet: ${w.walletAddress.slice(0,6)}...</div>
          <div>
            <button class="btn-approve" onclick="approveW('${w.id}')">Approve</button>
            <button class="btn-reject" onclick="rejectW('${w.id}')">Reject</button>
          </div>
        </div>`;
    });

    // Load Tasks
    const res = await fetch(API + '/api/admin/data');
    const data = await res.json();
    adminData.tasks = data.tasks || [];
    renderTasks();
  } catch (err) {
    alert("Error loading data: " + err.message);
  }
}

function renderTasks() {
  const tl = document.getElementById('taskList'); tl.innerHTML = '';
  adminData.tasks.forEach(t => {
    tl.innerHTML += `<div class="list-item">${t.name} (+${t.reward} GROV)</div>`;
  });
}

async function addTask() {
  const name = document.getElementById('taskName').value;
  const reward = parseInt(document.getElementById('taskReward').value);
  if (!name || !reward) return;
  adminData.tasks.push({ name, reward });
  
  await fetch(API + '/api/admin/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ tasks: adminData.tasks })
  });
  renderTasks();
  document.getElementById('taskName').value = '';
  document.getElementById('taskReward').value = '';
}

async function approveW(id) {
  await fetch(API + '/api/admin/approve-withdrawal', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ withdrawalId: id })
  });
  loadData();
  alert('✅ Withdrawal Approved! (Pending Token Launch)');
}

async function rejectW(id) {
  await fetch(API + '/api/admin/reject-withdrawal', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ withdrawalId: id })
  });
  loadData();
  alert('❌ Rejected! Balance refunded to user.');
}
</script>
</body>
</html>
