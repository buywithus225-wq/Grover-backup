<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grover Admin</title>
<style>
body { background: #030a1a; color: #fff; font-family: sans-serif; padding: 20px; }
.container { max-width: 500px; margin: auto; background: #0a1428; border: 2px solid #8b5cf6; border-radius: 12px; padding: 20px; }
input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #555; background: #111; color: white; }
button { background: #8b5cf6; cursor: pointer; font-weight: bold; border: none; margin-bottom: 10px; }
#login { text-align: center; }
#dashboard { display: none; }
.tab-btn { width: auto; display: inline-block; padding: 8px 12px; font-size: 12px; margin-right: 4px; background: #333; }
.tab-btn.active { background: #8b5cf6; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.list-item { background: #111; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div id="login">
    <h2>🔐 Grover Admin</h2>
    <input type="password" id="pin" placeholder="Enter Admin PIN">
    <button onclick="verifyPin()">Unlock</button>
  </div>
  
  <div id="dashboard">
    <h2>Dashboard</h2>
    <div style="margin-bottom:10px;">
      <button class="tab-btn active" onclick="switchTab('withdrawals')">💸 Withdrawals</button>
      <button class="tab-btn" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
      <button class="tab-btn" onclick="switchTab('tasks')">📋 Tasks</button>
      <button class="tab-btn" onclick="switchTab('economy')">💰 Economy</button>
    </div>

    <div id="tab-withdrawals" class="tab-content active">
      <div id="withdrawalList"></div>
    </div>

    <div id="tab-leaderboard" class="tab-content">
      <div id="userList"></div>
      <div style="display:flex; gap:5px;">
        <input type="text" id="fakeName" placeholder="Name">
        <input type="number" id="fakeRefs" placeholder="Refs">
        <button onclick="addFakeUser()" style="width:auto;">+</button>
      </div>
    </div>

    <div id="tab-tasks" class="tab-content">
      <div id="taskList"></div>
      <div style="display:flex; gap:5px;">
        <input type="text" id="taskName" placeholder="Name">
        <input type="number" id="taskReward" placeholder="Reward">
        <button onclick="addTask()" style="width:auto;">+</button>
      </div>
    </div>

    <div id="tab-economy" class="tab-content">
      <h3 style="font-size:14px; margin-bottom:10px;">Global Settings</h3>
      <input type="text" id="prizePool" placeholder="Prize Pool (TON)">
      <button onclick="saveSettings()">Save Prize Pool</button>
    </div>
  </div>
</div>

<script>
const API = 'https://grover-backup.onrender.com'; 
let adminPin = '';
let adminData = { tasks: [], fakeUsers: [], prizePool: '50' };

async function verifyPin() {
  adminPin = document.getElementById('pin').value;
  const res = await fetch(API + '/api/admin/verify', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ pin: adminPin })
  });
  if (res.ok) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  } else { alert('Wrong PIN'); }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

async function loadData() {
  // Load Withdrawals
  const wRes = await fetch(API + '/api/admin/withdrawals?pin=' + adminPin);
  const withdrawals = await wRes.json();
  const wList = document.getElementById('withdrawalList'); wList.innerHTML = '';
  if(withdrawals.length === 0) wList.innerHTML = '<div style="color:#555; font-size:12px;">No pending withdrawals.</div>';
  withdrawals.forEach(w => {
    wList.innerHTML += `<div class="list-item"><div>User: ${w.userId.slice(-6)}<br>Amt: ${w.amount} GROV</div><div><button style="width:auto; background:#22c55e; padding:4px 8px; font-size:10px;" onclick="approveW('${w.id}')">Approve</button></div></div>`;
  });

  // Load Settings
  const res = await fetch(API + '/api/admin/data');
  const data = await res.json();
  adminData = data;
  document.getElementById('prizePool').value = adminData.prizePool || '50';
  renderTasks();
  renderFakeUsers();
}

function renderTasks() {
  const tl = document.getElementById('taskList'); tl.innerHTML = '';
  (adminData.tasks || []).forEach((t, i) => {
    tl.innerHTML += `<div class="list-item"><div>${t.name} (+${t.reward})</div><button style="width:auto; background:#ef4444; padding:4px 8px;" onclick="removeTask(${i})">X</button></div>`;
  });
}

function renderFakeUsers() {
  const ul = document.getElementById('userList'); ul.innerHTML = '';
  (adminData.fakeUsers || []).forEach((u, i) => {
    ul.innerHTML += `<div class="list-item"><div>${u.name} (${u.refs} refs)</div><button style="width:auto; background:#ef4444; padding:4px 8px;" onclick="removeFakeUser(${i})">X</button></div>`;
  });
}

async function saveSettings() {
  adminData.prizePool = document.getElementById('prizePool').value;
  await fetch(API + '/api/admin/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(adminData)
  });
  alert('Saved!');
}

async function addTask() {
  const name = document.getElementById('taskName').value;
  const reward = parseInt(document.getElementById('taskReward').value);
  if (!name || !reward) return;
  adminData.tasks = adminData.tasks || [];
  adminData.tasks.push({ name, reward });
  await saveSettings(); renderTasks();
  document.getElementById('taskName').value = '';
  document.getElementById('taskReward').value = '';
}

async function removeTask(i) {
  adminData.tasks.splice(i, 1);
  await saveSettings(); renderTasks();
}

async function addFakeUser() {
  const name = document.getElementById('fakeName').value;
  const refs = parseInt(document.getElementById('fakeRefs').value);
  if (!name || !refs) return;
  adminData.fakeUsers = adminData.fakeUsers || [];
  adminData.fakeUsers.push({ name, refs });
  await saveSettings(); renderFakeUsers();
  document.getElementById('fakeName').value = '';
  document.getElementById('fakeRefs').value = '';
}

async function removeFakeUser(i) {
  adminData.fakeUsers.splice(i, 1);
  await saveSettings(); renderFakeUsers();
}

async function approveW(id) {
  await fetch(API + '/api/admin/approve-withdrawal', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ withdrawalId: id })
  });
  loadData(); alert('Approved!');
}
</script>
</body>
</html>
